stages:
  - check
  - publish

image: rust:1-alpine3.23

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"

before_script:
  - rustup component add rustfmt clippy

cache:
  key: cargo
  paths:
    - .cargo/
    - target/

check:
  stage: check
  script:
    - cargo fmt --check
    - cargo test
    - cargo publish --run-dry

publish:
  stage: publish
  script:
    - cargo publish
  rules:
    - if: '$CI_COMMIT_TAG'
