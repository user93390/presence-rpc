[package]
name = "presence-rpc"
version = "0.0.1"
edition = "2024"
authors = ["seasnail1"]
license = "Apache-2.0"

[dependencies]
flume = { version = "0.12.0", default-features = false }
thiserror = { version = "2.0.20", default-features = false }
miniserde = "0.1.46"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
